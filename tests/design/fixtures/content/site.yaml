pages:
  blog:
    title: blog
    metaDescription: writing, photos, and notes on things i'm thinking about.
    intro: writing, photos, and half-formed thoughts — on whatever i've been making, reading, or wandering into lately.
    allTags: all
    noMatch: no posts match these tags.
  library:
    title: library
    metaDescription: books, videos, podcasts, and courses i've been learning from, with my notes.
