# site-wide copy: every heading, label, link text and message the site shows
# that isn't part of a specific entry. designs render these; they never hardcode
# their own. see content/README.md for the full content model.
#
# arrows and separators (←, →, ·) are not content; designs add their own.

site:
  name: andrew zhou
  title: andrew zhou
  description: electrical engineering & computer science @ uc berkeley
  footer: © andrew zhou 2025-2026
  titleSeparator: " · "
  notFoundTitle: not found

# the site map: four hubs in the persistent nav. each hub gathers sections
# that exist today; old urls (/blog/x, /activities/496, …) keep working and
# sit under their hub in breadcrumbs.
hubs:
  - id: work
    label: work
    href: /work
    intro: what i've worked on, researched, taught and built.
    sections: [work, research, teaching, projects, coursework]
  - id: writing
    label: writing
    href: /writing
    intro: posts, and notes on what i've been reading and watching.
    sections: [blog, library]
  - id: photos
    label: photos
    href: /photos
    intro: photos i've taken when i remember to bring a camera.
    sections: [photos]
  - id: training
    label: training
    href: /training
    intro: runs, rides, hikes and lifts, recorded and logged.
    sections: [activities, lifts]

nav:
  home: home
  blog: blog
  library: library
  photos: photos
  previous: previous
  next: next

