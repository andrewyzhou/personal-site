        speed: speed curve
        speedNoun: speed
        aria: "{title}: best average {noun} for each duration, {readout}"
      climbs:
        title: climbs
        climb: climb
        distance: distance
        gain: gain
        grade: grade avg / max
        category: "cat {category}"
        hc: hc
      zones:
        title: zones
        heartRate: heart rate
        pace: pace
        zone: "z{n}"
