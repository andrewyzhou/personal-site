name: integrity audit

# weekly read-only audit of the raw store (manifest vs bucket, re-hash sample,
# dangling sources, orphans, legacy originals). fails the run on any integrity
# failure. the r2 key must be able to read both R2_BUCKET and R2_RAW_BUCKET.
on:
  schedule:
    - cron: "41 10 * * 0" # sundays 10:41 utc
  workflow_dispatch:
    inputs:
      full:
        description: "re-hash every object (not just a sample)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: audit raw integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_RAW_BUCKET: ${{ secrets.R2_RAW_BUCKET }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: npx tsx scripts/audit-raw-integrity.mts $FULL --republish-check
