name: import activities

# vercel hobby crons are daily-only; this pulls new strava / intervals.icu
# activities every 30 minutes by hitting the same cron endpoint
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: hit /api/cron/activities
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/activities"
